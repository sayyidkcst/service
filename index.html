<title>Nearby – services around you</title>
<style>
:root{color-scheme:light dark;--bg:#eef3f4;--card:#fff;--fg:#0f1d24;--mut:#5d7079;--line:#e1e8eb;--acc:#0f766e;--acc2:#14b8a6;--red:#dc2626;--hd1:#0f766e;--hd2:#14b8a6;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1418;--card:#121f25;--fg:#e8f1f4;--mut:#8fa5af;--line:#1f3139;--acc:#14b8a6;--acc2:#2dd4bf;--hd1:#0b3b38;--hd2:#0f766e}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{position:relative;max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.hd{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 16px;border-radius:0 0 28px 28px;box-shadow:0 10px 28px #0f766e40;z-index:5;flex:0 0 auto}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.loc{display:flex;align-items:center;gap:6px;background:none;border:0;color:#fff;font:700 19px inherit;cursor:pointer;padding:2px 0;text-align:left;max-width:100%}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}.loc i{font-style:normal;font-size:13px;opacity:.8}
.round{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff26;color:#fff;font-size:20px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.srch{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--card);color:var(--fg);border-radius:16px;padding:0 14px;box-shadow:0 6px 18px #00000022}
.srch svg{width:20px;height:20px;fill:var(--mut);flex:0 0 auto}
.srch input{flex:1;border:0;background:none;color:var(--fg);font:16px inherit;padding:14px 0;min-width:0;outline:0}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px calc(110px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -14px;padding:4px 14px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:68px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--mut);font:600 11px inherit}
.chip .ci{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:var(--card);border:1px solid var(--line);transition:all .2s}
.chip.on{color:var(--fg)}.chip.on .ci{background:var(--c);border-color:transparent;transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 45%,transparent)}
.filters{display:flex;gap:8px;margin:2px 0 6px}
.filters select{flex:1;min-width:0;font:600 13px inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 14px}
#status{color:var(--mut);font-size:12.5px;margin:8px 4px 12px;min-height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:0 4px 16px #0f1d240d;animation:in .4s both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.media{display:block;width:100%;height:170px;object-fit:cover;cursor:pointer;background:var(--line)}
.cb{display:flex;gap:12px;padding:14px 14px 4px}
.ico{flex:0 0 48px;height:48px;border-radius:15px;background:color-mix(in srgb,var(--c,#0f766e) 16%,transparent);display:grid;place-items:center;font-size:24px}
.in{flex:1;min-width:0}
.tr{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.dist{margin-left:auto;font:700 12px inherit;color:var(--acc);background:color-mix(in srgb,var(--acc2) 16%,transparent);padding:3px 9px;border-radius:10px}
.in b{display:block;font-size:17px;overflow-wrap:anywhere;letter-spacing:-.01em}
.in span.t{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.in small{display:block;color:var(--mut);font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.badge{display:inline-block;font:800 9.5px inherit;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:7px;padding:3px 7px}
.act{display:flex;gap:8px;padding:12px 14px 14px}
.act a{flex:1;text-align:center;text-decoration:none;font:700 14px inherit;padding:11px 10px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.act a.alt{background:color-mix(in srgb,var(--acc2) 14%,transparent);color:var(--acc)}
.act a:active{transform:scale(.97)}
.empty{text-align:center;color:var(--mut);padding:44px 16px;font-size:14px;line-height:1.55}.empty .eg{font-size:44px;margin-bottom:8px}
.sk{height:120px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-bottom:14px;animation:p 1.2s infinite alternate}
@keyframes p{to{opacity:.45}}
.note{color:var(--mut);font-size:11px;text-align:center;margin-top:10px}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px inherit;padding:6px 0;cursor:pointer;min-width:0}
.tab svg{width:24px;height:24px;fill:currentColor}.tab.on{color:var(--acc)}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.plus{flex:0 0 70px;padding:0}
.tab.plus b{display:grid;place-items:center;width:54px;height:54px;margin-top:-26px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 22px #0f766e77;border:4px solid var(--bg)}
.tab.plus:active b{transform:scale(.94)}
input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc2);border-color:transparent}
.btn{font:700 14px inherit;border:0;border-radius:13px;padding:0 16px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;white-space:nowrap}
.btn.alt{background:color-mix(in srgb,var(--acc2) 14%,transparent);color:var(--acc);border:0}
.btn.full{width:100%;padding:14px;margin-top:8px}.btn.sm{padding:10px 14px;font-size:13px}.btn.red{background:var(--red)}
.pick{display:block;margin-top:10px;border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;font-size:14px}
.pv{display:none;width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-top:10px}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:0 0 auto;margin-right:10px}
#mod{position:fixed;inset:0;z-index:50;background:#0009;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
#mod.on{display:flex;animation:fi .18s}@keyframes fi{from{opacity:0}}
#sheet{position:relative;width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:26px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
#sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#sheet h2{font-size:22px;margin-bottom:4px;letter-spacing:-.01em}
#sheet input,#sheet select{width:100%;margin-top:10px}
.sub{color:var(--mut);font-size:14px;margin-bottom:8px}
.x{position:absolute;right:12px;top:14px;border:0;background:none;color:var(--mut);font-size:28px;cursor:pointer;line-height:1}
.sw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin:10px 0 2px}
.sw button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:11px;font:700 14px inherit;cursor:pointer}
.sw button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.err{color:var(--red);font-size:13px;min-height:18px;margin:8px 0 2px}
.locrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:13px;color:var(--mut)}
.mrow{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow b{display:block}.mrow span{color:var(--mut);font-size:13px}
.cic{width:60px;height:60px;border-radius:50%;background:#dc262622;display:grid;place-items:center;margin:6px auto 10px;font-size:26px}
.two{display:flex;gap:10px;margin-top:14px}.two .btn{flex:1;padding:13px}
.sosg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sosg a{text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;font-size:13px;color:var(--mut)}
.sosg a b{display:block;font-size:30px;color:var(--red);letter-spacing:-.02em}.sosg a.s1{grid-column:1/-1;background:#dc262614;border-color:#dc262644}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app">
  <header class="hd">
    <div class="hrow">
      <div style="min-width:0"><div class="brand">📍 Nearby</div>
        <button class="loc" id="locb"><span id="where">Finding your location…</span><i>▾</i></button></div>
      <button class="round" id="gpsb" aria-label="Use my location">◎</button>
    </div>
    <div class="srch"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 5 14l5 5 2-2-5-5A8 8 0 0 0 10 2zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
      <input id="f" type="search" placeholder="Search shops, hospitals, vehicles…" enterkeyhint="search"></div>
  </header>

  <main id="main">
    <div class="chips" id="chips"></div>
    <div class="filters">
      <select id="sort" aria-label="Sort"><option value="newest">Sort: Newest</option><option value="near">Sort: Nearest</option><option value="name">Sort: A to Z</option><option value="cat">Sort: Category</option></select>
      <select id="rad" aria-label="Distance"><option value="0" selected>Any distance</option><option value="1">Within 1 km</option><option value="3">Within 3 km</option><option value="5">Within 5 km</option><option value="10">Within 10 km</option></select>
    </div>
    <div id="status"></div>
    <div id="list"></div>
    <div class="note">Places come from OpenStreetMap and from people like you. Some details may be missing.</div>
  </main>

  <nav class="tabs">
    <button class="tab on" id="t-ex"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.2 5.8-2.1 6.3-6.3 2.1 2.1-6.3 6.3-2.1z"/></svg><span>Explore</span></button>
    <button class="tab" id="t-sos"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.400 11.400 0 0 0 3.600.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.300.2 2.500.6 3.600a1 1 0 0 1-.25 1z"/></svg><span>SOS</span></button>
    <button class="tab plus" id="add" aria-label="Add place"><b>+</b></button>
    <button class="tab" id="t-my"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.250 7 13 7 13s7-7.750 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg><span>My places</span></button>
    <button class="tab" id="acct"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.500-9 6v2h18v-2c0-3.500-4-6-9-6z"/></svg><span id="acct-l">Log in</span></button>
  </nav>
</div>
<div id="mod"><div id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS={
  all:{label:"All",ico:"🔎",q:[]},
  hospital:{label:"Hospitals",ico:"🏥",q:['nwr["amenity"~"^(hospital|clinic|doctors)$"]']},
  pharmacy:{label:"Pharmacies",ico:"💊",q:['nwr["amenity"="pharmacy"]']},
  police:{label:"Police",ico:"🚓",q:['nwr["amenity"="police"]']},
  fire:{label:"Fire stations",ico:"🚒",q:['nwr["amenity"="fire_station"]']},
  shop:{label:"Shops",ico:"🛍️",q:['nwr["shop"]'],named:1},
  transport:{label:"Vehicles and transport",ico:"🚕",q:['nwr["amenity"~"^(taxi|bus_station|car_rental|bicycle_rental|motorcycle_rental)$"]','nwr["highway"="bus_stop"]','nwr["railway"="station"]']},
  fuel:{label:"Fuel",ico:"⛽",q:['nwr["amenity"="fuel"]']},
  bank:{label:"Banks and ATMs",ico:"🏦",q:['nwr["amenity"~"^(bank|atm)$"]'],named:1},
  food:{label:"Food",ico:"🍽️",q:['nwr["amenity"~"^(restaurant|cafe|fast_food)$"]'],named:1}
};
const SERVERS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
const URL_="https://jfkocwuaerxnmxuhlyok.supabase.co",KEY="sb_publishable_C6jmy7c8Q60PClOqawXtJg_RNbvR5B3";
const H={apikey:KEY,"Content-Type":"application/json"};
async function rpc(fn,body){const r=await fetch(`${URL_}/rest/v1/rpc/${fn}`,{method:"POST",headers:H,body:JSON.stringify(body)});if(!r.ok){let m="Request failed";try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}return r.json()}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const toast=t=>{const x=$("#toast");x.textContent=t;x.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.opacity=0,2400)};
let me=null;try{me=JSON.parse(localStorage.getItem("nearby_user")||"null")}catch(e){}
const saveMe=()=>{try{me?localStorage.setItem("nearby_user",JSON.stringify(me)):localStorage.removeItem("nearby_user")}catch(e){}};
let loc=null,cat="all",items=[],comm=[],osmFail=false,busy=0;
const cache=new Map();

const COL={all:"#0f766e",hospital:"#ef4444",pharmacy:"#10b981",police:"#3b82f6",fire:"#f97316",shop:"#8b5cf6",transport:"#eab308",fuel:"#64748b",bank:"#0ea5e9",food:"#ec4899"};
const SHORT={all:"All",hospital:"Hospital",pharmacy:"Pharmacy",police:"Police",fire:"Fire",shop:"Shops",transport:"Vehicles",fuel:"Fuel",bank:"Banks",food:"Food"};
$("#chips").innerHTML=Object.entries(CATS).map(([k,c])=>`<button class="chip${k===cat?" on":""}" data-c="${k}" style="--c:${COL[k]}"><span class="ci">${c.ico}</span>${SHORT[k]}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;setCat(b.dataset.c);$("#f").value="";render();load()};
let sortTouched=false;
$("#rad").onchange=()=>{render();load()};
$("#sort").onchange=()=>{sortTouched=true;render()};
$("#f").oninput=render;

const status=t=>$("#status").textContent=t;
const km=(a,b,c,d)=>{const p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const fmtD=k=>k<1?Math.max(10,Math.round(k*100)*10)+" m":k.toFixed(1)+" km";
function catOf(t){
  const a=t.amenity||"";
  if(/^(hospital|clinic|doctors)$/.test(a))return"hospital";
  if(a==="pharmacy")return"pharmacy";if(a==="police")return"police";if(a==="fire_station")return"fire";
  if(a==="fuel")return"fuel";if(/^(bank|atm)$/.test(a))return"bank";if(/^(restaurant|cafe|fast_food)$/.test(a))return"food";
  if(t.shop)return"shop";
  return"transport"}
const capAll=l=>{const n={};return l.filter(i=>(n[i.cat]=(n[i.cat]||0)+1)<=15)};
const pretty=s=>s.replace(/_/g," ").replace(/^./,c=>c.toUpperCase());

async function setLoc(lat,lon,label){
  loc={lat,lon};$("#where").textContent=label||"📍 Your location";if(!sortTouched)$("#sort").value="near";load();
  if(label)return;
  try{
    const j=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&lat=${lat}&lon=${lon}`)).json(),a=j.address||{};
    const n=a.suburb||a.village||a.town||a.city||a.county||"";
    if(n&&loc&&loc.lat===lat)$("#where").textContent="📍 Near "+n+(a.state_district?", "+a.state_district:"")
  }catch(e){}}

function useMe(){
  if(!navigator.geolocation){$("#where").textContent="Location is not supported. Search an area instead.";return}
  $("#where").textContent="Finding your location…";
  navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude),
    ()=>{$("#where").textContent="Location is blocked. Search an area below.";render()},
    {enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
$("#gpsb").onclick=useMe;
$("#locb").onclick=()=>openLoc();
async function goArea(){
  const q=$("#area").value.trim();if(!q)return;
  $("#l-err").textContent="Searching…";
  try{
    const r=await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q))).json();
    if(!r.length){$("#l-err").textContent="Area not found. Try a different name.";return}
    closeMod();setLoc(+r[0].lat,+r[0].lon,"📍 "+r[0].display_name.split(",").slice(0,2).join(","))
  }catch(e){$("#l-err").textContent="Could not search that area. Check your internet."}}
function openLoc(){
  openMod(`<h2>Choose location</h2><p class="sub">See places near you or in any area</p>
    <button class="btn full" id="l-gps">📍 Use my current location</button>
    <div style="display:flex;gap:8px;margin-top:12px"><input id="area" placeholder="Search an area, e.g. Areekode" style="margin-top:0;flex:1" enterkeyhint="search"><button class="btn sm" id="go">Go</button></div>
    <div class="err" id="l-err"></div>`);
  $("#l-gps").onclick=()=>{closeMod();useMe()};
  $("#go").onclick=goArea;$("#area").onkeydown=e=>{if(e.key==="Enter")goArea()}}
function openSOS(){
  openMod(`<h2>Emergency</h2><p class="sub">Tap a number to call. These are India numbers.</p>
    <div class="sosg"><a href="tel:112" class="s1"><b>112</b>All emergencies</a><a href="tel:100"><b>100</b>Police</a><a href="tel:108"><b>108</b>Ambulance</a><a href="tel:101"><b>101</b>Fire</a></div>
    <button class="btn full alt" id="s-h">🏥 Find nearest hospital</button>`);
  $("#s-h").onclick=()=>{closeMod();setCat("hospital");$("#sort").value="near";sortTouched=true;render();load()}}
$("#t-sos").onclick=openSOS;
$("#t-my").onclick=()=>me?openMine():openAuth(openMine);
$("#t-ex").onclick=()=>$("#main").scrollTo({top:0,behavior:"smooth"});

function setCat(k){cat=k;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.c===k))}
async function fetchOSM(r){
  const all=cat==="all",qs=all?Object.entries(CATS).filter(([k])=>k!=="all").flatMap(([,c])=>c.q):CATS[cat].q;
  const q=`[out:json][timeout:${all?40:25}];(${qs.map(x=>`${x}(around:${r},${loc.lat},${loc.lon});`).join("")});out center tags ${all?900:300};`;
  for(const u of SERVERS){
    try{
      const ac=new AbortController(),t=setTimeout(()=>ac.abort(),all?35000:20000);
      const res=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ac.signal});
      clearTimeout(t);if(!res.ok)throw new Error("HTTP "+res.status);
      const data=await res.json();
      const list=data.elements.map(e=>{
        const lat=e.lat!=null?e.lat:e.center&&e.center.lat,lon=e.lon!=null?e.lon:e.center&&e.center.lon,t=e.tags||{};
        if(lat==null)return null;
        const raw=t.amenity||t.shop||t.highway||t.railway||"place";
        return{lat,lon,t,name:t.name||t["name:en"]||"",type:raw==="yes"?"Shop":pretty(raw),cat:catOf(t),d:km(loc.lat,loc.lon,lat,lon)}
      }).filter(i=>i&&(i.name||(all?["hospital","pharmacy","police","fire","fuel"].includes(i.cat):!CATS[cat].named))).sort((a,b)=>a.d-b.d);
      return all?capAll(list):list
    }catch(e){}}
  return null}
async function loadComm(){
  try{
    const res=await fetch(`${URL_}/rest/v1/places?select=*&order=created_at.desc&limit=1000`,{headers:{apikey:KEY}});
    if(!res.ok)return;
    comm=(await res.json()).map(p=>({comm:1,id:p.id,user_id:p.user_id,owner:p.owner_name,lat:p.lat,lon:p.lon,name:p.name,type:p.detail||(CATS[p.category]?CATS[p.category].label:"Place"),phone:p.phone,address:p.address,image:p.image_url,cat:p.category,created:p.created_at,t:{},d:null}))
  }catch(e){}}
async function load(){
  if(!loc){render();return}
  const rad=+$("#rad").value,r=(rad>0?rad:5)*1000,key=[cat,loc.lat.toFixed(3),loc.lon.toFixed(3),r].join("|"),my=++busy;
  status("Searching nearby places…");
  let osm=cache.get(key);
  if(!osm){osm=await fetchOSM(r);if(osm)cache.set(key,osm)}
  if(my!==busy)return;
  osmFail=!osm;items=osm||[];render()}

function card(i,k){
  const ph=(i.comm?i.phone:(i.t.phone||i.t["contact:phone"]||"")).split(";")[0].trim();
  const addr=i.comm?(i.address||""):[i.t["addr:housename"],i.t["addr:street"],i.t["addr:suburb"]||i.t["addr:city"]].filter(Boolean).join(", ");
  const own=i.comm&&me&&i.user_id===me.id,c=i.cat||cat,ico=(CATS[c]||CATS.all).ico;
  return `<div class="card" style="--i:${Math.min(k||0,10)}">${i.comm&&i.image?`<img class="media" src="${esc(i.image)}" alt="" loading="lazy" data-zoom="${esc(i.image)}">`:""}<div class="cb"><div class="ico" style="--c:${COL[c]||COL.all}">${ico}</div><div class="in"><div class="tr">${i.comm?'<span class="badge">Local listing</span>':""}${i.d!=null?`<span class="dist">${fmtD(i.d)}</span>`:""}</div><b>${esc(i.name||"Unnamed "+i.type.toLowerCase())}</b><span class="t">${esc(i.type)}</span>${addr?`<small>📍 ${esc(addr)}</small>`:""}${i.t.opening_hours?`<small>🕒 ${esc(i.t.opening_hours)}</small>`:""}${ph?`<small>📞 ${esc(ph)}</small>`:""}${i.comm&&i.owner?`<small>Added by ${esc(i.owner)}</small>`:""}</div></div><div class="act"><a href="https://www.google.com/maps/dir/?api=1&destination=${i.lat},${i.lon}" target="_blank" rel="noopener">Directions</a>${ph?`<a class="alt" href="tel:${esc(ph.replace(/[^\d+]/g,""))}">Call</a>`:""}${own?`<a class="alt" href="#" data-del="${i.id}" data-n="${esc(i.name)}" data-img="${esc(i.image||"")}">Delete</a>`:""}</div></div>`}
$("#list").onclick=e=>{
  const z=e.target.closest("[data-zoom]");
  if(z){openMod(`<img src="${esc(z.dataset.zoom)}" alt="" style="width:100%;border-radius:14px;margin-top:20px">`);return}
  const a=e.target.closest("[data-del]");if(!a)return;e.preventDefault();confirmDel(+a.dataset.del,a.dataset.n,null,a.dataset.img)};

function render(){
  const f=$("#f").value.trim().toLowerCase(),rad=+$("#rad").value;
  let all=[...comm,...items].filter(i=>cat==="all"||i.cat===cat);
  all.forEach(i=>i.d=loc?km(loc.lat,loc.lon,i.lat,i.lon):null);
  if(rad>0&&loc)all=all.filter(i=>i.d<=rad);
  if(f)all=all.filter(i=>[i.name,i.type,i.address,i.phone,i.owner,CATS[i.cat]?CATS[i.cat].label:""].join(" ").toLowerCase().includes(f));
  let sort=$("#sort").value;if(sort==="near"&&!loc)sort="newest";
  const by={
    near:(a,b)=>(a.d==null)-(b.d==null)||a.d-b.d,
    newest:(a,b)=>(b.comm?1:0)-(a.comm?1:0)||String(b.created||"").localeCompare(String(a.created||"")),
    name:(a,b)=>(a.name||"~").localeCompare(b.name||"~"),
    cat:(a,b)=>(a.cat||"").localeCompare(b.cat||"")||(a.d||0)-(b.d||0)};
  all.sort(by[sort]);
  const lab=cat==="all"?"places":CATS[cat].label.toLowerCase(),sn={near:"nearest first",newest:"newest first",name:"A to Z",cat:"by category"}[sort];
  status(all.length?`${all.length} ${lab}${rad>0&&loc?` within ${rad} km`:""}, ${sn}${!loc?". Allow location or search an area to see distances and nearby places":""}${osmFail?" (map data unavailable)":""}`:"");
  $("#list").innerHTML=all.slice(0,200).map((x,k)=>card(x,k)).join("")||'<div class="empty"><div class="eg">🔎</div>Nothing found.<br>Try another category or search, or add a place with the + button.</div>'}

/* ---------- Photo helper ---------- */
function toJpeg(file,max=900){return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>b?res(b):rej(new Error("Image error")),"image/jpeg",.85)};
  img.onerror=()=>rej(new Error("Could not read image"));img.src=URL.createObjectURL(file)})}

/* ---------- Modal ---------- */
const mod=$("#mod"),sheet=$("#sheet");
function openMod(h){sheet.innerHTML='<button class="x" id="mx" aria-label="Close">×</button>'+h;mod.classList.add("on");$("#mx").onclick=closeMod}
function closeMod(){mod.classList.remove("on")}
mod.onclick=e=>{if(e.target===mod)closeMod()};

/* ---------- Login ---------- */
const paintAcct=()=>$("#acct-l").textContent=me?me.name.split(" ")[0]:"Log in";
function openAuth(next){
  let mode="in";
  openMod(`<h2>Welcome</h2><p class="sub">Log in with your mobile number to add places</p>
    <div class="sw"><button id="m-in" class="on">Log in</button><button id="m-up">Sign up</button></div>
    <input id="u-name" placeholder="Your name" style="display:none" autocomplete="name">
    <input id="u-mob" type="tel" placeholder="Mobile number" inputmode="tel" autocomplete="tel">
    <input id="u-pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div class="err" id="u-err"></div><button class="btn full" id="u-go">Log in</button>`);
  const set=m=>{mode=m;$("#m-in").classList.toggle("on",m==="in");$("#m-up").classList.toggle("on",m==="up");$("#u-name").style.display=m==="up"?"block":"none";$("#u-go").textContent=m==="in"?"Log in":"Create account";$("#u-err").textContent=""};
  $("#m-in").onclick=()=>set("in");$("#m-up").onclick=()=>set("up");
  $("#u-go").onclick=async()=>{
    const mob=$("#u-mob").value.replace(/[\s\-+()]/g,""),pw=$("#u-pw").value,name=$("#u-name").value.trim(),err=$("#u-err");
    err.textContent="";
    if(!/^\d{7,15}$/.test(mob)){err.textContent="Enter a valid mobile number (digits only)";return}
    if(pw.length<6){err.textContent="Password must be at least 6 characters";return}
    if(mode==="up"&&!name){err.textContent="Enter your name";return}
    const b=$("#u-go");b.disabled=true;
    try{
      const h=await sha("swipe:"+mob+":"+pw);
      const r=mode==="up"?await rpc("signup",{p_mobile:mob,p_name:name,p_hash:h}):await rpc("login",{p_mobile:mob,p_hash:h});
      if(r.error){err.textContent=r.error;b.disabled=false;return}
      me={id:r.id,name:r.name,mobile:mob,hash:h};saveMe();paintAcct();closeMod();toast("Welcome, "+me.name.split(" ")[0]);
      if(next)next();else render()
    }catch(e){err.textContent=e.message;b.disabled=false}}}
$("#acct").onclick=()=>{
  if(!me){openAuth();return}
  openMod(`<h2>${esc(me.name)}</h2><p class="sub">+${esc(me.mobile)}</p><button class="btn full" id="ml">My listings</button><button class="btn full alt" id="lo" style="margin-top:8px">Log out</button>`);
  $("#ml").onclick=openMine;
  $("#lo").onclick=()=>{me=null;saveMe();paintAcct();closeMod();render()}};

/* ---------- Add / my listings / delete ---------- */
let aLoc=null,aImg=null,aPlace="";
function openAdd(){
  if(!me){openAuth(openAdd);return}
  aLoc=loc?{lat:loc.lat,lon:loc.lon}:null;aImg=null;aPlace=loc?"Current search area":"";
  openMod(`<h2>Add a place</h2><p class="sub">Shop, hospital, vehicle for hire and more. People nearby can find it.</p>
    <select id="a-cat">${Object.entries(CATS).filter(([k])=>k!=="all").map(([k,c])=>`<option value="${k}"${k===cat?" selected":""}>${c.ico} ${c.label}</option>`).join("")}</select>
    <input id="a-name" placeholder="Name (shop, hospital, vehicle owner)" maxlength="120">
    <input id="a-phone" type="tel" placeholder="Phone number" maxlength="30">
    <input id="a-detail" placeholder="Details (e.g. Auto rickshaw, open 24 hours)" maxlength="200">
    <input id="a-addr" placeholder="Address or landmark" maxlength="300">
    <label class="pick" for="a-img" id="a-pk">📷 Add a photo (optional)</label><input id="a-img" type="file" accept="image/*" hidden><img class="pv" id="a-pv" alt="">
    <div style="display:flex;gap:8px;margin-top:10px"><input id="a-find" placeholder="Search exact location, e.g. Areekode police station" style="margin-top:0;flex:1"><button class="btn sm" id="a-fb">Find</button></div>
    <div class="locrow"><span id="a-loc"></span><button class="btn alt sm" id="a-gps">Use my GPS</button></div>
    <div class="err" id="a-err"></div><button class="btn full" id="a-save">Save place</button>`);
  const showL=()=>$("#a-loc").innerHTML=aLoc?`📍 <a href="https://www.google.com/maps?q=${aLoc.lat},${aLoc.lon}" target="_blank" rel="noopener" style="color:var(--acc)">${aPlace?esc(aPlace):aLoc.lat.toFixed(5)+", "+aLoc.lon.toFixed(5)}</a>`:"📍 No location yet";
  showL();
  const doFind=async()=>{
    const q=$("#a-find").value.trim();if(!q)return;$("#a-err").textContent="";
    try{
      const r=await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q))).json();
      if(!r.length){$("#a-err").textContent="Location not found. Try a nearby landmark, or stand at the place and tap Use my GPS.";return}
      aLoc={lat:+r[0].lat,lon:+r[0].lon};aPlace=r[0].display_name.split(",").slice(0,3).join(",");showL()
    }catch(e){$("#a-err").textContent="Could not search. Check your internet."}};
  $("#a-fb").onclick=doFind;$("#a-find").onkeydown=e=>{if(e.key==="Enter")doFind()};
  $("#a-img").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{aImg=await toJpeg(f);const v=$("#a-pv");v.src=URL.createObjectURL(aImg);v.style.display="block";$("#a-pk").textContent="📷 Change photo"}
    catch(er){$("#a-err").textContent="Could not read that photo"}};
  $("#a-gps").onclick=()=>{
    if(!navigator.geolocation){$("#a-err").textContent="Location is not supported on this device";return}
    navigator.geolocation.getCurrentPosition(p=>{aLoc={lat:p.coords.latitude,lon:p.coords.longitude};aPlace="";showL();$("#a-err").textContent=""},
      ()=>{$("#a-err").textContent="Could not get location. Allow location access and try again."},{enableHighAccuracy:true,timeout:12000})};
  $("#a-save").onclick=async()=>{
    const err=$("#a-err"),name=$("#a-name").value.trim();err.textContent="";
    if(!name){err.textContent="Enter a name";return}
    if(!aLoc){err.textContent="Tap Use my current location first";return}
    const b=$("#a-save");b.disabled=true;
    try{
      const c=$("#a-cat").value;
      let imgUrl=null;
      if(aImg){
        b.textContent="Uploading photo…";
        const path=`places/${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const up=await fetch(`${URL_}/storage/v1/object/media/${path}`,{method:"POST",headers:{apikey:KEY,"Content-Type":"image/jpeg"},body:aImg});
        if(!up.ok){err.textContent="Photo upload failed. Try again or save without a photo.";b.disabled=false;b.textContent="Save place";return}
        imgUrl=`${URL_}/storage/v1/object/public/media/${path}`}
      const r=await rpc("add_place",{p_mobile:me.mobile,p_hash:me.hash,p_category:c,p_name:name,p_phone:$("#a-phone").value.trim(),p_detail:$("#a-detail").value.trim(),p_address:$("#a-addr").value.trim(),p_lat:aLoc.lat,p_lon:aLoc.lon,p_image:imgUrl});
      if(r.error){err.textContent=r.error;b.disabled=false;b.textContent="Save place";return}
      loc={lat:aLoc.lat,lon:aLoc.lon};$("#where").textContent="📍 Showing "+name;
      setCat(c);closeMod();toast("Place added");loadComm().then(()=>{render();load()})
    }catch(e){err.textContent=e.message;b.disabled=false}}}
$("#add").onclick=openAdd;

async function openMine(){
  openMod('<h2>My listings</h2><div id="mine"><div class="sk"></div></div>');
  try{
    const r=await (await fetch(`${URL_}/rest/v1/places?select=*&user_id=eq.${me.id}&order=created_at.desc`,{headers:{apikey:KEY}})).json();
    $("#mine").innerHTML=r.length?r.map(p=>`<div class="mrow">${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="">`:""}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><span>${CATS[p.category]?CATS[p.category].label:esc(p.category)}${p.phone?" · "+esc(p.phone):""}</span></div><button class="btn sm" data-show="${p.lat},${p.lon}" data-cat="${esc(p.category)}" data-n="${esc(p.name)}">Show</button> <button class="btn alt sm" data-id="${p.id}" data-n="${esc(p.name)}" data-img="${esc(p.image_url||"")}">Delete</button></div>`).join(""):'<div class="empty">You have not added any places yet.</div>';
    $("#mine").querySelectorAll("button[data-show]").forEach(b=>b.onclick=()=>{
      const [la,lo]=b.dataset.show.split(",").map(Number);
      setCat(b.dataset.cat);loc={lat:la,lon:lo};$("#where").textContent="📍 Showing "+b.dataset.n;closeMod();load()});
    $("#mine").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>confirmDel(+b.dataset.id,b.dataset.n,openMine,b.dataset.img))
  }catch(e){$("#mine").innerHTML='<div class="empty">Could not load. Check your internet.</div>'}}
function confirmDel(id,name,after,img){
  openMod(`<div class="cic">🗑️</div><h2 style="text-align:center">Delete place?</h2><p class="sub" style="text-align:center">${esc(name)} will be removed for everyone.</p><div class="two"><button class="btn alt" id="dn">Cancel</button><button class="btn red" id="dy">Delete</button></div>`);
  $("#dn").onclick=()=>after?after():closeMod();
  $("#dy").onclick=async()=>{
    try{const r=await rpc("delete_place",{p_mobile:me.mobile,p_hash:me.hash,p_id:id});if(r.error)throw new Error(r.error);
      const ip=(img||"").split("/object/public/media/")[1];
      if(ip)fetch(`${URL_}/storage/v1/object/media/${ip}`,{method:"DELETE",headers:{apikey:KEY}}).catch(()=>{});
      toast("Deleted");after?after():closeMod();loadComm().then(()=>{render();load()})}catch(e){toast(e.message)}}}

paintAcct();
$("#list").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
loadComm().then(render);
useMe();
</script>
</body>
</html>
